name: Infrastructure CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  dockerfile-validation:
    name: Dockerfile Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          # Validate that all Dockerfiles in devops/docker are syntactically valid
          for dockerfile in devops/docker/Dockerfile*; do
            echo "Validating $dockerfile..."
            docker build --check -f "$dockerfile" . || exit 1
          done

  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose -f devops/docker/docker-compose.yml config --quiet