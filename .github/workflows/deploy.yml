name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpsVision-Backend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend-src

      - name: Checkout Frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpsVision-Frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frontend-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-src
          file: ./backend-src/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Copy nginx.conf into frontend build context
        run: cp devops/docker/nginx.conf frontend-src/frontend/nginx.conf

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-src/frontend
          file: ./devops/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-kind:
    name: Deploy to Kind Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          config: devops/kubernetes/kind-config.yaml
          cluster_name: opsvision-cluster

      - name: Install NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Create namespace
        run: kubectl apply -f devops/kubernetes/namespace.yaml

      - name: Apply secrets
        run: kubectl apply -f devops/kubernetes/secrets.yaml

      - name: Deploy PostgreSQL
        run: kubectl apply -f devops/kubernetes/postgres-deployment.yaml

      - name: Deploy backend
        run: kubectl apply -f devops/kubernetes/backend-deployment.yaml

      - name: Deploy frontend
        run: kubectl apply -f devops/kubernetes/frontend-deployment.yaml

      - name: Deploy ingress
        run: kubectl apply -f devops/kubernetes/ingress.yaml

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/opsvision-backend -n opsvision --timeout=120s
          kubectl rollout status deployment/opsvision-frontend -n opsvision --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get all -n opsvision
          kubectl get ingress -n opsvision
