name: Trivy Scan (reusable)

on:
  workflow_call:
    inputs:
      path:
        required: false
        type: string
        default: "."
      trivy_args:
        required: false
        type: string
        default: "--severity HIGH,CRITICAL"

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven dependencies (if needed)
        if: ${{ hashFiles('**/pom.xml') != '' }}
        run: |
          POM_DIR=$(find . -name "pom.xml" -not -path "*/target/*" -exec dirname {} \; | head -1)
          if [ -n "$POM_DIR" ]; then
            cd "$POM_DIR"
            mvn dependency:resolve
          fi

      # ✅ Use official Trivy Action - no need to install manually
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.path }}
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'