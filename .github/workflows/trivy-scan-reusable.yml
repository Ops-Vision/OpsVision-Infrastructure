name: Trivy Scan (reusable)

# Recommend callers do NOT pass a secret named GITHUB_TOKEN to the workflow_call
on:
  workflow_call:
    inputs:
      path:
        required: false
        type: string
        default: "."
      trivy_args:
        required: false
        type: string
        default: "--severity HIGH,CRITICAL"

# Explicit permissions for the reusable workflow. Do not declare a secret named GITHUB_TOKEN
permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Resolve Maven dependencies
        working-directory: .
        run: ./mvnw dependency:resolve    

      - name: Run Trivy filesystem scan
        run: |
          trivy fs ${{ inputs.trivy_args }} ${{ inputs.path }}
